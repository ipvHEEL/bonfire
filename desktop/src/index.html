<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonfire — подключение</title>
    <style>
        :root {
            --bg: #21202e;
            --surface: #2e2b38;
            --text: #81e1f2;
            --text-muted: #8a87a0;
            --accent: #a277f9;
            --accent-hover: #b48ffa;
            --on-accent: #ffffff;
            --danger: #ff7a90;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.5;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            border-radius: 20px;
            background-color: var(--surface);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .brand h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
            color: var(--text);
        }

        p {
            margin: 0 0 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid transparent;
            border-radius: 22px;
            background-color: var(--bg);
            color: var(--text);
            font: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus {
            border-color: var(--accent);
        }

        .error {
            min-height: 20px;
            margin: 12px 0;
            color: var(--danger);
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 22px;
            background-color: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.7;
            cursor: default;
        }

        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">
            <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
                <path fill="currentColor" d="M12 2c.5 3.2-1.4 5-3 6.8C7.4 10.6 6 12.4 6 15a6 6 0 0 0 12 0c0-2.2-1-4-2.2-5.4-.3 1.5-1 2.6-2.3 3.2.4-3.6-.6-7.6-1.5-10.8z" />
            </svg>
            <h1>Bonfire</h1>
        </div>
        <p>Укажите адрес сервера Bonfire — его можно узнать у того, кто его запустил.</p>

        <form id="form" novalidate>
            <label>
                Адрес сервера
                <input id="server" placeholder="https://192.168.1.13:8443" autocomplete="url" autofocus />
            </label>
            <div class="error" id="error" role="alert"></div>
            <button id="submit" type="submit">Подключиться</button>
        </form>
    </main>

    <script>
        const invoke = window.__TAURI__.core.invoke
        const form = document.getElementById('form')
        const input = document.getElementById('server')
        const error = document.getElementById('error')
        const submit = document.getElementById('submit')

        invoke('get_server').then((server) => {
            if (server) input.value = server.replace(/\/$/, '')
        })

        function withScheme(value) {
            return value.includes('://') ? value : 'https://' + value
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault()
            error.textContent = ''
            const value = input.value.trim()
            if (!value) {
                error.textContent = 'Введите адрес сервера'
                return
            }

            submit.disabled = true
            submit.textContent = 'Проверяем…'
            try {
                // Проверяем, что сервер отвечает и его сертификат принят. Ответ
                // чужого адреса прочитать нельзя (no-cors), но ошибка сети или
                // недоверенный сертификат всё равно приведут к исключению
                const url = new URL(withScheme(value))
                await fetch(url.origin + '/api/auth/me', { mode: 'no-cors', cache: 'no-store' })
            } catch {
                // Браузер не сообщает, что именно не так, поэтому перечисляем частые причины
                error.textContent = 'Сервер не отвечает. Проверьте адрес и что сервер запущен. '
                    + 'Если он на этом же компьютере — попробуйте https://localhost:8443. '
                    + 'Также мешать может VPN, блокирующий локальную сеть, или неустановленный сертификат ca.crt'
                submit.disabled = false
                submit.textContent = 'Подключиться'
                return
            }

            try {
                await invoke('set_server', { server: value })
            } catch (message) {
                error.textContent = message
                submit.disabled = false
                submit.textContent = 'Подключиться'
            }
        })
    </script>
</body>
</html>
