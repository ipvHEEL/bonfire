[package]
name = "bonfire-desktop"
version = "0.1.0"
description = "Bonfire — десктоп-клиент для Windows"
edition = "2021"

[lib]
name = "bonfire_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
# Версии закреплены точно: обновлять осознанно, проверив совместимость
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-notification = "=2.5.0"
tauri-plugin-opener = "=2.6.0"
tauri-plugin-single-instance = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Клиент должен быть лёгким: меньше размер, отладочные символы не нужны
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
