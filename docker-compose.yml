services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bonfire}
      POSTGRES_USER: ${POSTGRES_USER:-bonfire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bonfire}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-bonfire}:${POSTGRES_PASSWORD:-bonfire}@db:5432/${POSTGRES_DB:-bonfire}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-the-env-file}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
