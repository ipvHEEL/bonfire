# По http только перенаправляем на https: микрофон для звонков браузер
# даёт лишь защищённым страницам. 8443 — порт https на хосте (docker-compose.yml)
server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;

    # Сертификат выпускает scripts/make-certs.sh, docker-compose.yml монтирует его сюда
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    root /usr/share/nginx/html;
    index index.html;

    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $http_host;
    }

    # Сигнальное соединение LiveKit (вебсокет). Сам звук идёт мимо nginx —
    # напрямую на UDP-порт LiveKit
    location /livekit/ {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
