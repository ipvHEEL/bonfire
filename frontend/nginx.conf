# По http только перенаправляем на https: микрофон для звонков браузер
# даёт лишь защищённым страницам. 8443 — порт https на хосте (docker-compose.yml)
server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

# Локальные адреса (localhost, адрес в домашней сети). Сертификат выпускает
# scripts/make-certs.sh, docker-compose.yml монтирует его сюда
server {
    listen 443 ssl default_server;
    http2 on;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    include /etc/nginx/bonfire/locations.conf;
}

# Адрес в сети Tailscale (имя.tailnet.ts.net) с настоящим сертификатом
# Let's Encrypt. Файл создаёт scripts/tailscale-cert.ps1; пока его нет,
# шаблон ничего не подключает и работает только локальный адрес
include /etc/nginx/certs/tailscale*.conf;
