# Общие правила для всех адресов сервера: и локального, и Tailscale

root /usr/share/nginx/html;
index index.html;

location /ws {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}

# X-Forwarded-For — настоящий адрес клиента: по нему бэкенд считает
# попытки входа. На сервере перед nginx стоит Caddy, он кладёт туда
# адрес клиента, а nginx дописывает свой
location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Сигнальное соединение LiveKit (вебсокет). Сам звук идёт мимо nginx —
# напрямую на UDP-порт LiveKit
location /livekit/ {
    proxy_pass http://livekit:7880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 1h;
}

location / {
    try_files $uri $uri/ /index.html;
}
