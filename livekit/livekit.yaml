# Медиасервер для звонков. Ключи API и адрес в сети передаются из
# docker-compose.yml, чтобы не хранить секреты в репозитории
port: 7880
rtc:
  # Звук идёт по одному UDP-порту: Docker Desktop на Windows плохо
  # пробрасывает большие диапазоны портов, которые LiveKit берёт по умолчанию
  udp_port: 7882
  # Запасной путь, если UDP заблокирован в сети
  tcp_port: 7881
  # Только локальная сеть: не определяем внешний адрес через STUN
  use_external_ip: false
logging:
  level: info
